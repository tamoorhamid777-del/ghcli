[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghcli"
version = "1.1.0"
description = "A GitHub CLI client — manage repos, issues, PRs, commits, and files from your terminal."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ghcli contributors" }]
keywords = ["github", "cli", "git", "devtools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.5",
    "types-requests>=2.31",
    "bandit>=1.7",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
ghcli = "ghcli.main:main"

[project.urls]
Homepage = "https://github.com/tamoorhamid777-del/ghcli"
Repository = "https://github.com/tamoorhamid777-del/ghcli"
"Bug Tracker" = "https://github.com/tamoorhamid777-del/ghcli/issues"
Changelog = "https://github.com/tamoorhamid777-del/ghcli/blob/main/CHANGELOG.md"

# ── Tool configuration ──────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["ghcli*"]
exclude = ["tests*", "*.egg-info"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ghcli"]
omit = ["tests/*", "ghcli/skills/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false